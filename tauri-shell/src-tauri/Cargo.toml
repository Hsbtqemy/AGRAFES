[package]
name = "agrafes-shell"
version = "0.4.1"
description = "AGRAFES Shell — unified Tauri V0 app (Prep + Concordancier)"
authors = ["AGRAFES"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` : l'inspecteur du webview, compile AUSSI en release.
# Tauri l'active tout seul en debug, jamais en release — et c'est precisement
# dans l'application installee qu'on en a besoin : la QA du 2026-08-16 a bute sur
# un panneau blanc dont l'erreur JS n'etait consultable nulle part. Le cout est une
# API de plus (WebView2 porte deja l'inspecteur cote OS) ; l'exposition est nulle
# pour un outil local dont l'utilisateur est aussi celui qui deboguera.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-deep-link = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "time"] }
dirs = "6"
# OS keychain for ShareDocs "remember credentials" (Phase 4A). `windows-native`
# enables the Windows Credential Manager backend (the shipped target); add
# `apple-native` / `sync-secret-service` when macOS/Linux builds are needed.
keyring = { version = "3", features = ["windows-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
