<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* ============================================================
   Journal de bord — apparat critique
   minium = ouvert · outremer = interaction · verdet = achevé
   mono = dérivé de git/du parseur · sérif = écrit à la main
   ============================================================ */
:root{
  --verge:#E6E7E1; --plat:#FAFAF7; --plat2:#F1F2ED;
  --encre:#14171B; --encre2:#4A5259; --encre3:#79828A;
  --minium:#B7332B; --outremer:#2B4C8C; --outremer-pale:#DFE5F2; --verdet:#3D7A5D;
  --pl-close-bg:#14171B; --pl-close-fg:#D6D8D1; --pl-close-fg2:#8F958F;
  --sr:'Newsreader',Charter,'Bitstream Charter',Georgia,serif;
  --mo:ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace;
  --t1:.6875rem; --t2:.8125rem; --t3:1rem; --t4:1.25rem; --t5:1.875rem;
  --gout:7.75rem;
}
@media (prefers-color-scheme:dark){:root{
  --verge:#101317; --plat:#191D22; --plat2:#20252B;
  --encre:#E4E6E0; --encre2:#A3ABB2; --encre3:#727B83;
  --minium:#E4685C; --outremer:#8CACEC; --outremer-pale:#1C2740; --verdet:#6FBC93;
  --pl-close-bg:#272D34; --pl-close-fg:#C6CAC4; --pl-close-fg2:#7E868D;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--verge);color:var(--encre);
  font:400 var(--t3)/1.6 var(--sr);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2.5px solid var(--outremer);outline-offset:2px;border-radius:2px}
a{color:var(--outremer)}

/* ---------- chrome ---------- */
.tete{background:var(--plat);border-bottom:2px solid var(--encre)}
.tete-in,.corps{max-width:64rem;margin:0 auto;padding:0 1.5rem}
.tete-in{padding-top:1.5rem}
.marque{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin:0}
.marque b{font:600 var(--t4)/1 var(--mo);letter-spacing:-.02em}
.branche{font:400 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.1em;
  color:var(--outremer);background:var(--outremer-pale);padding:.35em .6em;border-radius:2px}
.etat{font:400 var(--t2)/1.5 var(--mo);color:var(--encre2);margin:.55rem 0 0}
.ong{display:flex;gap:.25rem;margin-top:1.1rem}
.ong a{font:500 var(--t2)/1 var(--mo);text-decoration:none;color:var(--encre2);
  padding:.6rem .9rem;border-radius:2px 2px 0 0;background:var(--plat2)}
.ong a:hover{color:var(--encre)}
.ong a.on{background:var(--encre);color:var(--plat)}
.corps{padding-top:2.25rem;padding-bottom:6rem}

/* ---------- intitulés ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  font:500 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.13em;
  color:var(--encre3);margin:2.75rem 0 .75rem}
.sec:first-child{margin-top:0}
.sec .n{font-variant-numeric:tabular-nums}

/* ---------- la plaque de sigle ---------- */
.plaque{background:var(--minium);color:#fff;padding:1rem .85rem;min-width:0;
  display:flex;flex-direction:column;justify-content:space-between;gap:.5rem}
.sigle{font:600 1.75rem/1 var(--mo);letter-spacing:-.045em;word-break:break-all}
.carte .sigle{font-size:var(--sig,1.75rem)}
.mesure{font:400 1.375rem/1 var(--mo);font-variant-numeric:tabular-nums}
.mesure i{font:400 var(--t1)/1 var(--mo);font-style:normal;opacity:.75;margin-left:.15em}
.mot{font:500 var(--t1)/1.3 var(--mo);text-transform:uppercase;letter-spacing:.11em;opacity:.82}
.s-dif .plaque{background:transparent;box-shadow:inset 0 0 0 2.5px var(--minium);color:var(--minium)}
/* « à venir » : rien n'a commencé. Pas le minium des chantiers vivants — l'outremer,
   qui n'appelle pas au secours mais annonce. */
.s-ven .plaque{background:var(--outremer)}
.s-clos .plaque,.s-liv .plaque{background:var(--pl-close-bg);color:var(--pl-close-fg)}
.s-clos .mot,.s-clos .mesure i,.s-liv .mesure i{color:var(--pl-close-fg2);opacity:1}
.s-liv .mot{color:var(--verdet);opacity:1}

/* ---------- carte ---------- */
.pile{display:flex;flex-direction:column;gap:.375rem}
.carte{position:relative;display:grid;grid-template-columns:var(--gout) 1fr;
  background:var(--plat);border-radius:2px;overflow:hidden}
.carte:hover{background:var(--plat2)}
.carte:focus-within{outline:2.5px solid var(--outremer);outline-offset:2px}
/* nappe cliquable : évite d'imbriquer une ancre de carte autour des pastilles */
.cible{color:inherit;text-decoration:none}
.cible::after{content:"";position:absolute;inset:0}
.cible:focus-visible{outline:none}
.corps-c{padding:1rem 1.25rem;min-width:0;display:flex;flex-direction:column;gap:.35rem}
.titre-c{font:500 var(--t4)/1.3 var(--sr);margin:0;letter-spacing:-.01em}
.lemme{font:400 var(--t3)/1.5 var(--sr);color:var(--encre2);margin:0;overflow-wrap:break-word}
.pied{font:400 var(--t2)/1.4 var(--mo);color:var(--encre3);margin:.15rem 0 0;
  display:flex;gap:.9rem;flex-wrap:wrap}
.pied .r{color:var(--minium)}
.pied .r0{color:var(--verdet)}
.pied .fr{color:var(--encre3)}
.pied .fr.nf{color:var(--encre2);font-weight:500}

/* liste repliée */
.repli{display:flex;flex-wrap:wrap;gap:.375rem}
.repli a{font:500 var(--t2)/1 var(--mo);text-decoration:none;color:var(--pl-close-fg);
  background:var(--pl-close-bg);padding:.6rem .75rem;border-radius:2px}
.repli a:hover{color:#fff}
.repli a .v{color:var(--verdet)}
.repli a .nf{color:var(--pl-close-fg2)}

/* ---------- folio ---------- */
.retour{font:500 var(--t2)/1 var(--mo);text-decoration:none;color:var(--encre2);
  display:inline-block;margin-bottom:1.25rem}
.retour:hover{color:var(--outremer)}
.folio{display:grid;grid-template-columns:15rem 1fr;gap:2.5rem;align-items:start}
.apparat{position:sticky;top:1.25rem;display:flex;flex-direction:column;gap:.375rem}
.apparat .plaque{border-radius:2px;padding:1.15rem 1rem;gap:1.5rem}
.apparat .sigle{font-size:2.25rem}
.meta{margin:0;background:var(--plat);border-radius:2px;padding:.9rem 1rem;
  font:400 var(--t2)/1.45 var(--mo)}
.meta div{padding:.45rem 0}
.meta div+div{border-top:1px solid var(--plat2)}
.meta dt{font-size:var(--t1);text-transform:uppercase;letter-spacing:.1em;color:var(--encre3)}
.meta dd{margin:.25rem 0 0;overflow-wrap:break-word}
.titre-f{font:600 var(--t5)/1.15 var(--sr);letter-spacing:-.022em;margin:0 0 .9rem}
.lemme-f{font:400 1.125rem/1.55 var(--sr);margin:0;padding:.9rem 1.1rem;
  background:var(--plat);border-left:3px solid var(--minium);border-radius:0 2px 2px 0}
.s-clos .lemme-f,.s-liv .lemme-f{border-left-color:var(--pl-close-bg)}
.s-dif .lemme-f{border-left-style:double;border-left-width:5px}
.s-ven .lemme-f{border-left-color:var(--outremer)}
.lemme-f b{font:600 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.11em;
  color:var(--encre3);display:block;margin-bottom:.35rem}

/* ---------- traînée de commits ---------- */
/* Sous le point de reprise, pas dans le panneau latéral : c'est la ligne écrite qu'on
   lit d'abord, et l'écart avec les faits doit se voir sans bouger les yeux. */
.trainee{list-style:none;margin:.5rem 0 0;padding:0;display:flex;flex-direction:column}
.trainee li{display:grid;grid-template-columns:5rem 6.25rem 1fr;gap:.9rem;align-items:baseline;
  padding:.4rem 1.1rem;font:400 var(--t2)/1.5 var(--mo)}
.trainee li:first-child{padding-top:.55rem}
.trainee .t-h{color:var(--encre2)}
.trainee .t-d{color:var(--encre3);font-variant-numeric:tabular-nums}
.trainee .t-s{font:400 .9375rem/1.5 var(--sr);color:var(--encre);overflow-wrap:break-word}
.trainee li+li .t-s{color:var(--encre2)}

/* ---------- cases ---------- */
.cases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.1875rem}
.case{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:start;
  background:var(--plat);border-radius:2px;padding:.7rem .95rem}
.case:hover{background:var(--plat2)}
.case input{appearance:none;-webkit-appearance:none;width:1.15rem;height:1.15rem;
  margin:.2rem 0 0;flex:none;border:2px solid var(--encre3);border-radius:2px;
  background:var(--verge);cursor:pointer}
.case input:hover{border-color:var(--verdet)}
.case input:checked{background:var(--verdet);border-color:var(--verdet)}
.case input:checked::after{content:"";display:block;width:.3rem;height:.6rem;
  margin:.08rem 0 0 .32rem;border:solid var(--plat);border-width:0 2.5px 2.5px 0;
  transform:rotate(43deg)}
.case label{font:400 var(--t3)/1.5 var(--sr);cursor:pointer;overflow-wrap:break-word}
.case input:checked~label{color:var(--encre3);text-decoration:line-through;
  text-decoration-color:var(--encre3);text-decoration-thickness:1px}

/* ---------- prose ---------- */
.prose{max-width:38rem}
.prose p{font:400 var(--t3)/1.7 var(--sr);color:var(--encre2);margin:0 0 .9rem}
.prose strong{font-weight:600;color:var(--encre)}
.prose code,.lemme code,.lemme-f code,.case code,.vide code{font:400 .85em/1 var(--mo);
  background:var(--plat2);padding:.15em .35em;border-radius:2px;color:var(--encre)}
.zone{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  font:500 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.13em;
  color:var(--encre3);margin:2rem 0 .6rem}
.zone .n{font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.06em}

/* ---------- pastilles ---------- */
.pill{font:500 .875em/1 var(--mo);text-decoration:none;padding:.18em .4em;
  border-radius:2px;white-space:nowrap;position:relative;z-index:1}
.pill.i{color:var(--outremer);background:var(--outremer-pale)}
.pill.e{color:var(--encre2);background:var(--plat2);box-shadow:inset 0 -1px 0 var(--encre3)}
.pill:hover{filter:brightness(.94)}

/* ---------- fil ---------- */
.filtre{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1.5rem}
.filtre label{font:500 var(--t1)/1 var(--mo);text-transform:uppercase;
  letter-spacing:.11em;color:var(--encre3)}
.filtre select{font:400 var(--t2)/1 var(--mo);color:var(--encre);background:var(--plat);
  border:2px solid var(--plat2);border-radius:2px;padding:.55rem .6rem;cursor:pointer}
.jour{font:500 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.13em;
  color:var(--plat);background:var(--encre);display:inline-block;
  padding:.5rem .75rem;border-radius:2px;margin:1.75rem 0 .5rem}
.cmts{display:flex;flex-direction:column;gap:.1875rem}
.cmt{display:grid;grid-template-columns:5.5rem 1fr;gap:.9rem;background:var(--plat);
  border-radius:2px;padding:.6rem .95rem;align-items:baseline}
/* ---------- en vol ---------- */
.vols{display:flex;flex-direction:column;gap:.1875rem}
.vol{display:grid;grid-template-columns:4.25rem 5.5rem 1fr auto;align-items:center;gap:1rem;
  background:var(--plat);border-radius:2px;padding:.7rem 1rem;text-decoration:none;color:inherit}
.vol:hover{background:var(--plat2)}
.vol:focus-visible{outline:2.5px solid var(--outremer);outline-offset:2px}
.v-n{font:400 1.125rem/1 var(--mo);font-variant-numeric:tabular-nums;text-align:right;color:var(--encre)}
.v-n i{font:400 var(--t1)/1 var(--mo);font-style:normal;color:var(--encre3);margin-left:.1em}
.v-j{height:.375rem;background:var(--verge);border-radius:1px;overflow:hidden}
.v-j i{display:block;height:100%;width:var(--p);background:var(--minium)}
.v-t{font:400 1.0625rem/1.35 var(--sr)}
.v-c .tr{font:400 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.1em;color:var(--encre3)}

/* ---------- tableau de bord ---------- */
.bord{display:flex;flex-direction:column;gap:.1875rem}
.b-l{display:grid;grid-template-columns:13rem 7rem 5.5rem 1fr;align-items:center;gap:1rem;
  background:var(--plat);border-radius:2px;padding:.7rem 1rem}
.b-k{font:400 var(--t2)/1.4 var(--mo);color:var(--encre2)}
.b-k code{font:inherit;color:var(--encre)}
.b-v{font:400 1.25rem/1 var(--mo);font-variant-numeric:tabular-nums;text-align:right;color:var(--encre)}
.b-v i{font:400 var(--t1)/1 var(--mo);font-style:normal;color:var(--encre3)}
.b-j{height:.375rem;background:var(--verge);border-radius:1px;overflow:hidden}
.b-j i{display:block;height:100%;width:var(--p);background:var(--encre3)}
.b-n{font:400 var(--t2)/1.4 var(--mo);color:var(--encre3)}
.b-n a{color:var(--outremer);text-decoration:none;border-bottom:1px solid transparent}
.b-n a:hover{border-bottom-color:currentColor}
.b-l.pres .b-v,.b-l.haut .b-v{color:var(--minium)}
.b-l.pres .b-j i,.b-l.haut .b-j i{background:var(--minium)}
.b-l.haut{box-shadow:inset 2.5px 0 0 var(--minium)}
.avs{display:flex;flex-direction:column;gap:.1875rem;margin-top:.5rem}
/* Même surface que les autres lignes : `plat2` aurait paru plus discret en clair
   mais plus voyant en sombre, où il est la teinte la plus claire des trois. Le
   second rang se tient donc par la typographie, pas par le fond. */
.av{display:grid;grid-template-columns:2rem 1fr 11rem;gap:1rem;padding:.6rem 1rem;
  align-items:baseline;background:var(--plat);border-radius:2px;
  font:400 var(--t2)/1.45 var(--mo);color:var(--encre3)}
.av .a-n{text-align:right;font-variant-numeric:tabular-nums;color:var(--encre)}
.av .a-m{color:var(--encre2)}
.av .a-l{text-align:right}
.av a{color:var(--outremer);text-decoration:none;border-bottom:1px solid transparent}
.av a:hover{border-bottom-color:currentColor}
.av a i{font-style:normal;color:var(--encre3);margin-left:.25em}

/* Une pastille ne se coupe pas — c est ce qu on veut d un code court, pas d un chemin
   de document. Mesuré : un nom de 34 caractères débordait de 34 px du panneau latéral,
   qui fait 208 px de contenu. La pastille de chemin s autorise donc la coupure ; elle
   reste une pastille, elle cesse d être insécable. */
.pill.doc{white-space:normal;overflow-wrap:anywhere}

/* Le serveur relit `journal.html` à chaque requête, jamais son propre code : après une
   mise à jour, un processus laissé en marche sert la vue NEUVE avec un moteur ANCIEN.
   Les champs manquants passent alors pour des données vides — une frise sans une seule
   barre, triée par ordre alphabétique faute de dates. Ça s'est produit une fois, et rien
   ne le disait. */
.perime{background:var(--minium);color:var(--plat);padding:.7rem 1rem;border-radius:2px;
  margin:0 0 1.2rem;font:400 var(--t2)/1.5 var(--mo)}
.perime b{font-weight:600}

/* La barre de carte : un segment posé sur une piste pleine largeur, sous le pied. Elle
   ne porte ni axe ni mois — c'est la comparaison d'une carte à l'autre qui informe.

   La PISTE doit se voir autant que le segment, et c'est tout l'enjeu : une barre seule,
   au bas d'une carte, se lit comme une jauge de progression. « R3, de 45 à 99 % » se
   comprendrait « presque fini » alors que R3 porte dix-huit restes. Une piste visible de
   bord à bord, identique sur toutes les cartes, avec deux extrémités marquées, dit que
   le segment est POSÉ quelque part et non qu'il REMPLIT depuis la gauche.

   La couleur suit le texte (currentColor) plutôt qu'un ton fixe : la piste suit le texte, donc les deux thèmes,
   et ne se confond pas avec le fond de la carte comme le faisait --verge. */
.mini{display:block;position:relative;height:9px;margin:.6rem 0 0}
.mini::before{content:"";position:absolute;left:0;right:0;top:3px;height:3px;
  border-radius:2px;background:currentColor;opacity:.13}
.mini::after{content:"";position:absolute;left:0;right:0;top:0;height:9px;
  border-left:1px solid currentColor;border-right:1px solid currentColor;opacity:.22}
.mini>span{position:absolute;top:3px;height:3px;border-radius:2px;background:var(--minium)}
.s-clos .mini>span,.s-liv .mini>span{background:var(--pl-close-bg)}
.s-ven .mini>span{background:var(--outremer)}
.s-dif .mini>span{background:var(--minium);opacity:.6}

/* ---- frise ---- */
/* Pas de SVG : une piste en position relative et des barres en pourcentage. Un SVG en
   largeur 100 % dans une colonne qui se dimensionne sur son contenu se résout en rond
   et disparaît — déjà payé sur les courbes de masse. */
.frise{margin:0 0 1.6rem}
.fr-corps{position:relative}
.fr-fond{position:absolute;inset:0 0 0 var(--gout);pointer-events:none}
/* `--verge` sert AUSSI de fond de page : le trait y était de la couleur exacte du fond,
   donc présent dans le DOM et invisible à l écran. Compter les traits ne prouvait rien —
   il fallait relever leur couleur. `currentColor` suit le texte, donc les deux thèmes. */
.fr-mois{position:absolute;top:0;bottom:0;width:1px;background:currentColor;opacity:.13}
.fr-l{display:grid;grid-template-columns:var(--gout) 1fr;align-items:center;
  min-height:1.55rem;position:relative}
.fr-l+.fr-l{margin-top:.1rem}
.fr-c{font:500 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.09em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:.6rem}
.fr-t{position:relative;height:1.55rem}
.fr-b{position:absolute;top:.42rem;height:.7rem;min-width:3px;border-radius:2px;
  background:var(--minium)}
.s-clos .fr-b,.s-liv .fr-b{background:var(--pl-close-bg)}
.s-ven .fr-b{background:var(--outremer)}
/* La fiche et l'audit sont des instants, pas des durées : un trait fin, pas une barre.
   Le losange de la fiche se distingue du trait de l'audit sans recourir à la couleur. */
/* Centrés sur leur date, pas accrochés par le bord gauche : un repère posé par son
   bord se lit APRÈS l'instant qu'il marque, et déborde de la piste aux dernières dates
   — mesuré, deux marques hors piste à 700 px de large. */
.fr-f,.fr-a{position:absolute;top:.3rem;height:.95rem;width:1px;background:var(--encre3);
  transform:translateX(-50%)}
.fr-f{transform:translateX(-50%) rotate(45deg);height:.5rem;width:.5rem;top:.5rem;
  background:none;box-shadow:inset 0 0 0 1.5px var(--encre3);border-radius:1px}
.fr-a{background:var(--outremer);width:2px}
/* La passe se range sous son chantier : retrait, trait plus fin, teinte pâle — elle
   accompagne la ligne au-dessus au lieu de rivaliser avec elle. */
.fr-lp{min-height:1.2rem}
.fr-lp .fr-c{padding-left:.7rem;font-size:.625rem;text-transform:none;letter-spacing:.02em;
  color:var(--encre3);font-weight:400}
.fr-lp .fr-t{height:1.2rem}
/* Une passe est le plus souvent un INSTANT, pas une durée : écrite et rejouée dans la
   même semaine, sa barre tombe à 3 px sur un axe de cent jours — mesuré, six sur huit.
   Elle est donc dessinée pour être lisible en point comme en barre : plus haute, plus
   large au minimum, et pleine plutôt que cernée. */
.fr-q{position:absolute;top:.4rem;height:.42rem;min-width:7px;border-radius:3px;
  background:var(--outremer);opacity:.5}
/* Hors champ : le repère est antérieur au premier commit et se tient au bord gauche.
   Creux plutôt que plein — il dit « avant », pas « ici ». */
/* Collé au bord, pas centré : un repère hors champ n'a pas de position réelle à
   marquer, et le centrage le faisait dépasser de sa piste par la gauche. */
.fr-avant{opacity:.55;transform:none}
.fr-f.fr-avant{transform:rotate(45deg)}
.fr-a.fr-avant{background:none;box-shadow:inset 0 0 0 1px var(--outremer);width:4px;
  border-radius:1px}
.fr-axe{display:grid;grid-template-columns:var(--gout) 1fr;margin-top:.35rem}
.fr-axe>div{position:relative;height:1rem}
.fr-m0{transform:none}
.fr-m{position:absolute;top:0;font:400 var(--t1)/1 var(--mo);color:var(--encre3);
  transform:translateX(-50%);white-space:nowrap}
.fr-leg{font:400 var(--t1)/1.5 var(--mo);color:var(--encre3);margin:.9rem 0 0}
.fr-leg b{font-weight:500;color:var(--encre2)}
@media (max-width:900px){
  .fr-l,.fr-axe{grid-template-columns:4.2rem 1fr}
  .fr-fond{inset:0 0 0 4.2rem}
}
.masses{width:100%;border-collapse:collapse;font:400 var(--t2)/1.4 var(--mo)}
.masses th{font:500 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.1em;
  color:var(--encre3);text-align:right;padding:0 0 .55rem;font-weight:500}
.masses th:first-child,.masses td.a{text-align:left}
.masses td{background:var(--plat);padding:.5rem .8rem;vertical-align:middle}
.masses tr td:first-child{border-radius:2px 0 0 2px}
.masses tr td:last-child{border-radius:0 2px 2px 0}
.masses tbody tr+tr td{border-top:1px solid var(--verge)}
/* le nom prend le mou, courbe et chiffres restent collés à droite */
.masses td.a{width:100%}
.masses td.v{width:1%}
.masses td.v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;
  color:var(--encre2)}
.masses td.v.moins{color:var(--verdet);font-weight:500}
.masses td.c{padding:0 .8rem}
/* largeur en dur : dans une colonne qui se rétrécit sur son contenu, un width:100%
   sur le SVG se résout circulairement et la courbe disparaît. */
.spark{display:block;width:132px;height:26px;overflow:visible}
.spark polyline{fill:none;stroke:var(--minium);stroke-width:1.5;
  vector-effect:non-scaling-stroke;stroke-linejoin:round}
.cmt.jal .h{color:var(--verdet);text-align:right}
.cmt.jal .s i{display:block;font:400 var(--t1)/1.6 var(--mo);font-style:normal;color:var(--encre3)}
.cmt .h{font:400 var(--t2)/1.5 var(--mo);color:var(--encre3)}
.cmt .s{font:400 .9375rem/1.5 var(--sr);overflow-wrap:break-word}

/* ---------- boutons, vides, toast ---------- */
.bt{font:500 var(--t2)/1 var(--mo);color:var(--plat);background:var(--encre);
  border:0;border-radius:2px;padding:.6rem .85rem;cursor:pointer}
.bt:hover{background:var(--encre2)}
.bt.danger{background:var(--minium);color:#fff}
.vide{background:var(--plat);border-radius:2px;padding:1.75rem;max-width:38rem}
.vide p{font:400 var(--t3)/1.6 var(--sr);color:var(--encre2);margin:0 0 .6rem}
.vide p:last-child{margin:0}
.vide b{font-weight:600;color:var(--encre)}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);
  font:500 var(--t2)/1.4 var(--mo);background:var(--encre);color:var(--plat);
  padding:.75rem 1.1rem;border-radius:2px;opacity:0;pointer-events:none;
  transition:opacity .18s;max-width:calc(100vw - 3rem)}
.toast.on{opacity:1}
.toast.ko{background:var(--minium);color:#fff}

/* ---------- responsive ---------- */
/* Le tableau de bord garde ses colonnes fixes (13+7+5,5rem) : mesurée, sa colonne
   de note tombe à 69 px de large à 602 px de fenêtre et la ligne passe de 42 à
   113 px de haut. Elle ne retrouve sa pleine largeur qu'au-delà de 1020. */
@media (max-width:900px){
  .b-l{grid-template-columns:1fr auto;gap:.3rem .8rem}
  .b-l .b-j,.b-l .b-n{grid-column:1/-1}
  /* Même mesure pour les avertissements : à 602 px la colonne de liens garde
     11rem en fixe et le message s'empile sur quatre lignes dans 282 px. */
  .av{grid-template-columns:2rem 1fr;gap:.25rem .8rem}
  .av .a-l{grid-column:2;text-align:left}
}
@media (max-width:760px){
  .folio{grid-template-columns:1fr;gap:1.5rem}
  .apparat{position:static}
  .titre-f{font-size:1.5rem}
}
@media (max-width:560px){
  .tete-in,.corps{padding-left:1rem;padding-right:1rem}
  .carte{grid-template-columns:1fr}
  .plaque,.apparat .plaque{flex-direction:row;align-items:baseline;gap:.75rem;
    padding:.7rem .95rem}
  .carte .sigle,.apparat .sigle{font-size:1.375rem}
  .mesure{font-size:1rem}
  .mot{margin-left:auto;text-align:right}
  .cmt{grid-template-columns:1fr;gap:.15rem}
  .ong a{padding:.55rem .7rem}
  /* Les bandes ajoutées les 21-22 août avaient des colonnes fixes et aucune règle
     étroite : à 430 px le corps de page défilait latéralement. Mesuré à la capture,
     invisible au clavier. */
  .vol{grid-template-columns:4.25rem 1fr;gap:.45rem .8rem}
  .vol .v-j{grid-column:1/-1;order:3}
  .vol .v-c{grid-column:1/-1;order:4}
  .trainee li{grid-template-columns:5rem 1fr;gap:.2rem .8rem;padding:.5rem .95rem}
  .trainee .t-s{grid-column:1/-1}
  .masses td.c{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="tete">
  <div class="tete-in">
    <p class="marque"><b id="repo">…</b><span class="branche" id="br">…</span></p>
    <p class="etat" id="sil"></p>
    <nav class="ong" id="tabs">
      <a href="#/">chantiers</a><a href="#/qa">passes</a><a href="#/frise">frise</a><a href="#/masses">masses</a><a href="#/fil">fil</a>
    </nav>
  </div>
</header>

<main id="vue" class="corps"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
let D = null, RXL = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const vsc = p => `vscode://file/${D.racine.replace(/\\/g, "/")}/${p}`;

/* pastilles — posées APRÈS échappement ; un code absent de liens reste du texte */
function pastilles(html){
  if (!D) return html;
  if (!RXL){
    const k = Object.keys(D.liens).sort((a, b) => b.length - a.length)
      .map(x => x.replace(/[.*+?^${}()|[\]\\-]/g, "\\$&"));
    RXL = k.length ? new RegExp(`(^|[^\\w-])(${k.join("|")})(?![\\w-])`, "g") : /$^/;
  }
  html = html.replace(RXL, (m, pre, code) => {
    const cible = D.liens[code];
    if (!cible) return m;
    return cible.startsWith("#")
      ? `${pre}<a class="pill i" href="${cible}">${code}</a>`
      : `${pre}<a class="pill e" href="${vsc(cible)}">${code}</a>`;
  });
  return html.replace(/(^|[^\w\/-])(docs\/[\w.\-]+\.md)/g,
    (m, pre, p) => `${pre}<a class="pill e doc" href="${vsc(p)}">${p.replace("docs/", "")}</a>`);
}

const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>")
                     .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const ligne = t => pastilles(inline(esc(t)));
const prose = md => pastilles(esc(md).split(/\n{2,}/)
  .map(p => "<p>" + inline(p.replace(/\n/g, " ")) + "</p>").join(""));

const OUVERT = s => s === "à venir" || s === "interrompu" || s === "différé";
const SLUG = { "à venir":"ven", "interrompu":"int", "différé":"dif", "clos":"clos", "livré":"liv" };
const slug = s => SLUG[s] || "int";
/* Un `à venir` que git dément : la fiche annonce que rien n'a commencé, et des commits
   qui citent son code touchent autre chose que la doc et `pilotage/`. Déclaré d'un
   côté, mesuré de l'autre — on montre l'écart plutôt que d'arbitrer. */
const dementi = c => c.statut === "à venir" && c.commitsCode > 0;
/* La portée d'un audit : combien le code a bougé sous lui depuis qu'il est écrit.
   Elle ne dit JAMAIS qu'un constat est réglé — aucune mesure ne peut le dire. Elle dit
   que le sol a bougé, donc qu'il faut relire avant de planifier. D'où « à relire » et
   jamais « périmé » : le second trancherait sur le fond.
   Zéro chemin et zéro commit ne se ressemblent pas et ne doivent pas se lire pareil —
   mesuré, un audit qui parle de comportements plutôt que de fichiers ne rend qu'un seul
   chemin, et son zéro voudrait dire « je n'ai pas su regarder ». */
const ditPortee = (p) => {
  if (!p) return null;
  if (p.echec) return "mesure impossible — la commande git a échoué";
  if (!p.chemins) return "aucun chemin reconnu dans ce document — mouvement <b>inconnu</b>, pas nul";
  const ou = `sur ${p.chemins} chemin${p.chemins > 1 ? "s" : ""} cité${p.chemins > 1 ? "s" : ""}`;
  if (!p.commits) return `aucun mouvement ${ou} depuis le ${jour(p.depuis)}`;
  return `<b>${p.commits.toLocaleString("fr-FR")} commits</b> ${ou}, depuis le ${jour(p.depuis)}
    <i>+${p.plus.toLocaleString("fr-FR")} −${p.moins.toLocaleString("fr-FR")}</i>`
    + (p.tronque ? " — compte partiel, trop de chemins pour une seule mesure" : "");
};

/* À relire : le sol a bougé ET il reste des constats ouverts dessus. L'un sans l'autre
   ne change rien à ce qu'on fait — un audit remué mais soldé est de l'histoire, un audit
   intact garde ses constats valables.
   Le compte porte sur les DOCUMENTS, pas sur les fiches : quatre chantiers partageaient
   le même audit et le faisaient compter quatre fois. On le relit une fois pour les quatre. */
const aRelire = () => {
  const par = new Map();
  for (const c of D.chantiers) {
    const a = D.controle?.audits?.[c.audit];
    if (!(c.portee?.commits > 0 && a?.reconnu && a.total > 0)) continue;
    const e = par.get(c.audit) || { audit: c.audit, portee: c.portee, ouverts: a.total, codes: [] };
    e.codes.push(c.code);
    par.set(c.audit, e);
  }
  return [...par.values()].sort((x, y) => y.portee.commits - x.portee.commits);
};

/* Les collisions : combien de fichiers deux chantiers ont touchés en commun. L'état de
   l'autre est dit avec le nombre, parce qu'il le retourne — 29 fichiers partagés avec un
   chantier livré, c'est un terrain stabilisé qu'on retrouvera tel quel ; 20 avec un
   chantier qui a bougé ce matin, c'est un risque présent. On montre l'état plutôt que
   d'en fabriquer une pondération : le lecteur sait ce que « livré » veut dire chez lui. */
const ditCollisions = (l) => l.slice(0, 3).map(x => {
  const ferme = x.statut === "clos" || x.statut === "livré";
  const etat = ferme ? esc(x.statut)
    : x.silence === null ? "jamais commencé"
    : `${x.silence} j de silence`;
  // Parenthèses : sans elles, « R5 20 4 j de silence » colle deux nombres qui ne parlent
  // pas de la même chose.
  return `<a href="#/c/${encodeURIComponent(x.code)}">${esc(x.code)}</a>
    <b>${x.n}</b> <i>(${etat})</i>`;
}).join(" · ");

/* Un champ que seule une version récente du serveur produit. On ne compare pas des
   numéros de version — il faudrait les tenir à jour des deux côtés — mais la présence de
   ce que la page a besoin de lire. Quand ce test devient faux, il suffit de le pointer
   vers un champ plus récent. */
const serveurPerime = () =>
  D.chantiers.length > 0 && D.chantiers[0].ficheDate === undefined;

const bandePerime = () => !serveurPerime() ? "" :
  `<p class="perime"><b>Le serveur tourne sur une version antérieure de
   <code>journal.mjs</code>.</b> La page est à jour, le moteur non : il relit le HTML à
   chaque requête mais jamais son propre code. Les dates, la portée des audits et les
   collisions manquent, et l'écran les montre comme si elles étaient vides. Arrête le
   processus et relance-le.</p>`;

const byCode = c => D.chantiers.find(x => x.code === c);
const byFile = f => D.passes.find(p => p.file === f);
const jour = s => new Date(s + "T00:00:00")
  .toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });
const sansCode = t => t.replace(/^\s*\S+\s*[—–]\s*/, "");
const vide = html => `<div class="vide">${html}</div>`;

/* la plaque : sigle, silence, statut. Rien d'autre. */
const taille = n => Math.min(1.75, Math.round(1010 / n) / 100);
const plaque = c => `<div class="plaque" style="--sig:${taille(c.code.length)}rem">
  <span class="sigle">${esc(c.code)}</span>
  <span class="mesure">${c.silence ?? "—"}<i>j</i></span>
  <span class="mot">${esc(c.statut)}</span></div>`;

/* ---------------- en vol + tableau de bord ---------------- */
/* Une passe est « en vol » si elle est entamée, ou armée depuis moins de deux jours
   actifs. 0/33 posée hier et 0/54 remise à zéro il y a cinq jours sont deux états
   différents : le second dort. Le seuil est en jours ACTIFS, comme le silence d'un
   chantier — en jours calendaires, une passe armée un vendredi mourait le lundi. */
const ARME = 2;
const enVol = () => D.passes.filter(p =>
  (p.faits > 0 && p.faits < p.total) || (p.faits === 0 && p.silence !== null && p.silence <= ARME));

const rowVol = p => `<a class="vol" href="#/qa/${encodeURIComponent(p.file)}">
    <span class="v-n">${p.faits}<i>/ ${p.total}</i></span>
    <span class="v-j"><i style="--p:${p.total ? Math.round(p.faits / p.total * 100) : 0}%"></i></span>
    <span class="v-t">${esc(p.nom)}</span>
    <span class="v-c">${p.chantier
      ? `<span class="pill i">${esc(p.chantier)}</span>`
      : `<span class="tr">transversale</span>`}</span></a>`;

function bandeVol(){
  const l = enVol();
  if (!l.length) return "";
  const reste = l.reduce((n, p) => n + p.total - p.faits, 0);
  return `<h2 class="sec"><span>En vol</span><span class="n">${reste} points à cocher</span></h2>
    <div class="vols">${l.map(rowVol).join("")}</div>`;
}

/* Un chiffre n'entre ici que s'il peut être mauvais et que l'être change la suite.
   Un seul a un seuil réel — la veille. Les autres ont une direction : pas de jauge
   inventée pour faire joli. */
function bandeBord(){
  const v = D.veille, c = D.controle;
  if (!v && !c) return "";
  const l = [];

  /* Les liens vivent dans la note, pas sur la ligne entière : une ancre autour d'une
     ligne qui contient déjà des ancres se fait démonter par le parseur — déjà vu sur
     les cartes le 19 août. */
  const versFiche = (code) => byCode(code)
    ? `<a href="#/c/${encodeURIComponent(code)}">${esc(code)}</a>` : esc(code);

  if (v) {
    const pc = Math.round(v.net / v.seuil * 100);
    l.push({ cle: `veille <code>${esc(v.fichier.split("/").pop())}</code>`,
      val: `${v.net > 0 ? "+" : ""}${v.net.toLocaleString("fr-FR")} <i>/ ${v.seuil}</i>`,
      etat: pc >= 100 ? "haut" : pc >= 75 ? "pres" : "",
      note: `${pc} % du budget, ${v.jours} jours glissants`
          + (v.chantier ? ` · ${versFiche(v.chantier)}` : ""),
      jauge: Math.min(100, Math.max(0, pc)) });
  }

  const vol = enVol(), file = vol.reduce((n, p) => n + p.total - p.faits, 0);
  const dort = D.passes.filter(p => !vol.includes(p)).reduce((n, p) => n + p.total - p.faits, 0);
  if (file || dort) l.push({ cle: "vérification en file", val: file.toLocaleString("fr-FR"),
    note: `<a href="#/qa">${vol.length} passe${vol.length > 1 ? "s" : ""} en vol</a>`
        + ` · ${dort} points au repos` });

  /* Le point de reprise est l'artefact le plus lu d'une fiche et le seul qui se
     périme sans bruit : il n'est faux que sur les chantiers actifs, exacts sur les
     dormants. On le compte plutôt que de compter sur l'œil.

     « Décalés », pas « périmés » — et ce n'est pas une nuance de style. Le contrôle
     exige le hash EXACT du dernier commit de code, donc il sur-déclenche par
     construction : une ligne écrite après ce commit mais citant autre chose (un
     commit de tenue, un merge) est signalée alors qu'elle est juste. Cette
     sur-sensibilité est le prix de la détection et non un défaut — l'alternative
     par date a été testée et rate le cas qui compte : une fiche avait été commitée
     DEUX FOIS après son dernier commit de code alors que son marqueur pointait
     encore deux mois en arrière. Un signal volontairement bruyant ne
     peut donc pas porter une étiquette qui tranche sur le fond : « périmé » dirait
     que le travail décrit est caduc, ce que la mesure ne montre jamais. Le nom
     interne (`arreteDecale`) disait déjà juste ; l'écran s'aligne dessus. */
  const dec = D.chantiers.filter(c => c.arreteDecale);
  if (dec.length) l.push({ cle: "points de reprise décalés", val: String(dec.length),
    note: `ne citent plus le dernier commit · ${dec.map(c => versFiche(c.code)).join(" ")}` });

  /* Même geste pour le seul autre champ déclaré que git puisse contredire : un
     chantier annoncé « à venir » sur lequel du code est déjà tombé. */
  const dem = D.chantiers.filter(dementi);
  if (dem.length) l.push({ cle: "« à venir » démentis", val: String(dem.length),
    note: `du code est déjà tombé · ${dem.map(c => versFiche(c.code)).join(" ")}` });

  /* Le seul autre endroit où un document déclaré se confronte à une mesure : l'audit
     sur lequel s'appuie un chantier, et le code qui a bougé sous lui depuis. */
  const rel = aRelire();
  if (rel.length) l.push({ cle: "audits à relire avant de planifier", val: String(rel.length),
    note: rel.slice(0, 3).map(e =>
      `${e.codes.map(versFiche).join(" ")} <i>${e.portee.commits} commits sous ${e.ouverts} constats</i>`
    ).join(" · ") });

  /* Le travail qu'aucune fiche ne peut montrer : des commits en vol dont le sujet ne
     cite aucun code, et qui touchent autre chose que le dossier et la documentation.
     Une branche entièrement couverte par ses chantiers ne paraît pas ici — elle n'a
     rien de mauvais à signaler, et la règle de cette bande est qu'un chiffre n'y entre
     que s'il peut l'être.
     Les sujets des premiers orphelins passent en infobulle : « 5 sans fiche » dit qu'il
     faut agir, pas SUR QUOI. */
  const brVol = (D.branches || []).filter(b => b.orphelins > 0);
  const perdus = brVol.reduce((n, b) => n + b.orphelins, 0);
  if (perdus) l.push({ cle: "commits en vol sans fiche", val: String(perdus),
    note: brVol.slice(0, 3).map(b =>
      `<span title="${esc(b.exemples.map(e => e.hash + "  " + e.sujet).join("\n"))}">${esc(b.nom)}</span>
       <i>${b.orphelins} sur ${b.avance}, jusqu'au ${jour(b.dernier.date)}</i>`).join(" · ") });

  /* Seul chiffre volontairement inerte : il est la somme des Reste de toutes les
     fiches, et sa destination est la liste qui suit déjà sur cet écran. */
  if (c?.nonCouvert) l.push({ cle: "items jamais confrontés", val: String(c.nonCouvert.items),
    note: "au code — aucun contrôle mécanique ne peut le faire" });

  const rec = Object.values(c?.audits || {}).filter(a => a.reconnu);
  if (rec.length) {
    const sev = {}; let tot = 0, sans = 0;
    for (const a of rec) { tot += a.total; sans += a.sansItem;
      for (const [s, n] of Object.entries(a.parSeverite || {})) sev[s] = (sev[s] || 0) + n; }
    // Dire OÙ vivent les 17 : sans la ventilation par fiche, le total ne mène nulle part.
    const par = rec.filter(a => a.total).sort((x, y) => y.total - x.total)
      .map(a => `${versFiche(a.chantier)} ${a.total}`).join(", ");
    l.push({ cle: "constats d'audit ouverts", val: String(tot),
      note: Object.entries(sev).map(([s, n]) => s + n).join(" ") + ` · ${par}`
          + (sans ? ` · ${sans} sans item` : "") });
  }

  const av = c?.avertissements || [];
  return `<h2 class="sec"><span>En attente</span>${
      av.length ? `<span class="n">${av.length} avertissements du contrôleur</span>` : ""}</h2>
    <div class="bord">${l.map(x => `<div class="b-l${x.etat ? " " + x.etat : ""}">
      <span class="b-k">${x.cle}</span>
      <span class="b-v">${x.val}</span>
      ${x.jauge !== undefined ? `<span class="b-j"><i style="--p:${x.jauge}%"></i></span>` : `<span></span>`}
      <span class="b-n">${x.note}</span></div>`).join("")}</div>
    ${!av.length ? "" : `<div class="avs">${
      /* Groupés par FORME du reproche, pas par nom de contrôle. Grouper sur `ctl`
         mettait « aucun tableau reconnu » et « un constat sans item » dans le même
         sac, et n'affichait que l'étiquette du contrôle — le lecteur voyait un nom
         de règle, jamais ce qu'elle reproche. On normalise les nombres et les
         chemins, ce qui reste est la phrase commune. */
      Object.values(av.reduce((g, a) => {
        // Le compte de tête et le chemin d'audit varient d'une fiche à l'autre. Le
        // compte part sur sa fiche plutôt que dans la phrase : « N item(s) ouvert(s) »
        // se lisait comme un gabarit, et l'information par fiche était perdue.
        const n = (a.msg.match(/^(\d+)/) || [])[1] || null;
        const forme = a.msg.replace(/^\d+\s*/, "").replace(/`?docs\/[^\s`:]+`?/g, "l'audit");
        (g[forme] ||= { forme, files: [] }).files.push({ file: a.file, n });
        return g;
      }, {})).sort((x, y) => y.files.length - x.files.length)
        .map(({ forme, files }) => `<div class="av">
          <span class="a-n">${files.length}</span>
          <span class="a-m">${ligne(forme)}</span>
          <span class="a-l">${files.map(({ file, n }) => {
            const c = file.replace(/^.*\//, "").replace(/\.md$/, "");
            return `<a href="#/c/${encodeURIComponent(c)}">${esc(c)}${n ? `<i>${n}</i>` : ""}</a>`;
          }).join(" ")}</span>
        </div>`).join("")}</div>`}`;
}

/* ---------------- accueil ---------------- */
function vueChantiers(){
  if (!D.chantiers.length) return vide(
    `<p>Aucune fiche dans <code>pilotage/</code>.</p>
     <p>Une fiche de chantier est un <code>.md</code> avec un front-matter
     <code>chantier:</code> et <code>statut:</code>, et ses reliquats en cases sous un
     titre <code>## Reste</code>. Le gabarit est dans <code>pilotage/_TEMPLATE.md</code>.</p>`);

  const tri = l => l.sort((a, b) => (a.silence ?? 1e9) - (b.silence ?? 1e9));
  const ven = tri(D.chantiers.filter(c => c.statut === "à venir"));
  const int = tri(D.chantiers.filter(c => c.statut === "interrompu"));
  const dif = tri(D.chantiers.filter(c => c.statut === "différé"));
  const fer = tri(D.chantiers.filter(c => !OUVERT(c.statut)));

  const ech = echelle();
  const carte = c => {
    const r = c.reste.filter(x => !x.fait).length;
    return `<article class="carte s-${slug(c.statut)}">${plaque(c)}
        <div class="corps-c">
          <h3 class="titre-c"><a class="cible"
            href="#/c/${encodeURIComponent(c.code)}">${esc(sansCode(c.titre))}</a></h3>
          ${c.arrete ? `<p class="lemme">${ligne(c.arrete)}</p>` : ""}
          <p class="pied">
            <span class="${r ? "r" : "r0"}">${r ? r + " reste" + (r > 1 ? "s" : "") : "aucun reliquat"}</span>
            ${dementi(c) ? `<span class="nf">${c.commitsCode} commit${c.commitsCode > 1 ? "s" : ""} de code</span>` : ""}
            ${c.dernier ? `<span>${c.dernier.hash} · ${c.dernier.date}</span>` : ""}
            ${c.front ? `<span class="fr${c.front.integre ? "" : " nf"}">${esc(c.front.ref)}</span>` : ""}
          </p>
          ${barreCarte(c, ech)}
        </div>
      </article>`;
  };
  const bloc = (l, t) => !l.length ? "" :
    `<h2 class="sec"><span>${t}</span><span class="n">${l.length}</span></h2>
     <div class="pile">${l.map(carte).join("")}</div>`;

  return bandeVol() + bandeBord()
       + bloc(ven, "À venir — cadrés, pas commencés")
       + bloc(int, "Interrompus — arrêtés en plein travail")
       + bloc(dif, "Différés — fermés volontairement, reliquat connu")
       + (ven.length || int.length || dif.length ? "" : vide(
           `<p>Aucun chantier ouvert — les ${D.chantiers.length} fiches sont closes ou livrées.</p>
            <p>Quand tu en reprends un, repasse son <code>statut:</code> à
            <code>interrompu</code> dans sa fiche et il remontera ici.</p>`))
       + (fer.length ? `<h2 class="sec"><span>Clos et livrés</span><span class="n">${fer.length}</span></h2>
           <div class="repli">${fer.map(c =>
             `<a href="#/c/${encodeURIComponent(c.code)}">${esc(c.code)}${
               c.statut === "livré" ? ` <span class="v">livré</span>` : ""}${
               c.front && !c.front.integre ? ` <span class="nf">${esc(c.front.ref)}</span>` : ""}</a>`).join("")}</div>` : "");
}

/* Les items du Reste, groupés par zone `###` s'il y en a. Aucune zone déclarée →
   liste simple, exactement comme avant : une fiche à trois items n'a rien à grouper. */
function zonesReste(c){
  const z = [];
  for (const r of c.reste) {
    const nom = r.zone || null;
    if (!z.length || z[z.length - 1].nom !== nom) z.push({ nom, items: [] });
    z[z.length - 1].items.push(r);
  }
  if (z.length === 1 && !z[0].nom)
    return `<ul class="cases">${c.reste.map(r => item(c.file, r)).join("")}</ul>`;
  return z.map(g => {
    const ouv = g.items.filter(i => !i.fait).length;
    return `${g.nom ? `<h3 class="zone"><span>${esc(g.nom)}</span>
        <span class="n">${ouv} / ${g.items.length}</span></h3>` : ""}
      <ul class="cases">${g.items.map(i => item(c.file, i)).join("")}</ul>`;
  }).join("");
}

/* ---------------- fiche ---------------- */
function vueFiche(code){
  const c = byCode(code);
  if (!c) return `<a class="retour" href="#/">← chantiers</a>` + vide(
    `<p>Aucune fiche pour le code <b>${esc(code)}</b>.</p>
     <p>Les codes connus sont ceux du front-matter <code>chantier:</code> des fichiers
     de <code>pilotage/</code>.</p>`);

  const ouv = c.reste.filter(r => !r.fait).length;
  const passes = c.passes.map(byFile).filter(Boolean);
  const meta = [
    /* « dernier commit » a quitté ce panneau : la traînée le donne avec son sujet,
       juste sous le point de reprise, là où on le lit. */
    c.front && ["intégration", c.front.integre ? esc(c.front.ref)
      : `${esc(c.front.ref)} — absent de ${(D.refs || []).map(esc).join(", ")}`],
    ["silence", `${c.silence ?? "—"} jours actifs`],
    ["commits", String(c.commits)],
    /* dire d'où vient le compte : sans ça, « 71 commits » pour un chantier dont le
       code n'apparaît que 12 fois dans l'historique ressemble à un bug. */
    c.remontee && ["remontée", `${c.remontee.length} codes de constat comptés comme
      <code>${esc(c.code)}</code> — ${c.remontee.slice(0, 2).map(esc).join(", ")}…`],
    c.audit && ["source", pastilles(esc(c.audit))],
    c.portee && ["portée", ditPortee(c.portee)],
    c.collisions && ["collisions", ditCollisions(c.collisions)
      + (c.collisions.length > 3 ? ` <i>+${c.collisions.length - 3} autres</i>` : "")],
    ["fiche", `<a href="${vsc(c.file)}">${esc(c.file)}</a>`]
  ].filter(Boolean);

  return `<a class="retour" href="#/">← chantiers</a>
   <div class="folio s-${slug(c.statut)}">
    <aside class="apparat">${plaque(c)}
      <dl class="meta">${meta.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    </aside>
    <div>
      <h1 class="titre-f">${esc(c.titre)}</h1>
      ${c.arrete ? `<p class="lemme-f"><b>${c.statut === "à venir" ? "Point de départ" : "Arrêté sur"}</b>${ligne(c.arrete)}</p>` : ""}
      ${!c.trainee?.length ? "" : `<ol class="trainee">${c.trainee.map(t => `<li>
        <span class="t-h">${t.hash}</span><span class="t-d">${t.date}</span>
        <span class="t-s">${ligne(t.sujet)}</span></li>`).join("")}</ol>`}

      <h2 class="sec"><span>Reste</span>${c.reste.length
        ? `<span class="n">${c.reste.length - ouv} / ${c.reste.length}</span>` : ""}</h2>
      ${c.reste.length
        ? zonesReste(c)
        : vide(`<p>Aucun reliquat déclaré.</p>
            <p>Si tu trouves du travail restant, ajoute une ligne <code>- [ ]</code> sous
            <code>## Reste</code> dans <a href="${vsc(c.file)}">${esc(c.file)}</a> — elle
            apparaîtra ici, cochable.</p>`)}

      ${passes.length ? `<h2 class="sec"><span>Passes de QA</span></h2>
        <div class="pile">${passes.map(rowPasse).join("")}</div>` : ""}

      ${c.contexte ? `<h2 class="sec"><span>Contexte</span></h2>
        <div class="prose">${prose(c.contexte)}</div>` : ""}
    </div>
   </div>`;
}

const item = (file, r) => {
  const id = `k${file.replace(/\W/g, "")}${r.ligne}`;
  return `<li class="case"><input type="checkbox" id="${id}" ${r.fait ? "checked" : ""}
    data-file="${esc(file)}" data-ligne="${r.ligne}">
    <label for="${id}">${ligne(r.texte)}</label></li>`;
};

/* ---------------- passes ---------------- */
const etat = p => !p.derniere ? "jamais jouée"
  : p.faits === p.total ? "complète" : `dernière ${p.derniere}`;

const rowPasse = p => `<article class="carte s-clos">
    <div class="plaque">
      <span class="mesure">${p.faits}<i>/ ${p.total}</i></span>
      <span class="mot">${esc(etat(p))}</span>
    </div>
    <div class="corps-c">
      <h3 class="titre-c"><a class="cible"
        href="#/qa/${encodeURIComponent(p.file)}">${esc(p.nom)}</a></h3>
      <p class="pied">
        ${p.chantier ? `<span>chantier ${pastilles(esc(p.chantier))}</span>`
                     : `<span>transversale</span>`}
        ${p.duree ? `<span>${esc(p.duree)}</span>` : ""}
        <span>${p.zones.length} zones</span>
      </p>
    </div>
  </article>`;

function vueQA(){
  if (!D.passes.length) return vide(
    `<p>Aucune passe dans <code>pilotage/qa/</code>.</p>
     <p>Une passe est une procédure <b>rejouable</b>, pas un état. Crée
     <code>pilotage/qa/&lt;nom&gt;.md</code> avec un front-matter <code>passe:</code>,
     et regroupe les points en cases sous des titres <code>###</code> de zone.</p>`);

  const bloc = (l, t) => !l.length ? "" :
    `<h2 class="sec"><span>${t}</span><span class="n">${l.length}</span></h2>
     <div class="pile">${l.map(rowPasse).join("")}</div>`;
  return bloc(D.passes.filter(p => !p.derniere), "Jamais jouées")
       + bloc(D.passes.filter(p => p.derniere), "Déjà jouées");
}

function vuePasse(file){
  const p = byFile(file);
  if (!p) return `<a class="retour" href="#/qa">← passes</a>` + vide(
    `<p>Aucune passe à ce chemin.</p>`);

  return `<a class="retour" href="#/qa">← passes</a>
    <h1 class="titre-f">${esc(p.titre)}</h1>
    <p class="etat" style="margin:0 0 1.5rem">
      ${p.faits} / ${p.total} cochés · ${esc(etat(p))}${p.duree ? " · " + esc(p.duree) : ""}
      ${p.chantier ? " · chantier " + pastilles(esc(p.chantier)) : " · transversale"}
      &nbsp;<button class="bt" id="reset" data-armed="0">réinitialiser</button>
    </p>
    ${p.intro ? `<div class="prose">${prose(p.intro)}</div>` : ""}
    ${p.zones.map(z => `<h3 class="zone">${esc(z.nom)}</h3>
      <ul class="cases">${z.items.map(i => item(p.file, i)).join("")}</ul>`).join("")}`;
}

/* ---------------- fil ---------------- */
let scope = "tout";
function vueFil(){
  if (!D.commits.length) return vide(
    `<p>Aucun commit sur la fenêtre courante.</p>
     <p>Relance le serveur avec une fenêtre plus large :
     <code>node journal.mjs --days 180</code>.</p>`);

  const n = {};
  D.commits.forEach(c => n[c.scope] = (n[c.scope] || 0) + 1);
  const scopes = Object.entries(n).sort((a, b) => b[1] - a[1]);
  const list = D.commits.filter(c => scope === "tout" || c.scope === scope);
  const jours = {};
  list.forEach(c => (jours[c.date] ||= []).push(c));

  return `<div class="filtre">
      <label for="sc">scope</label>
      <select id="sc">
        <option value="tout"${scope === "tout" ? " selected" : ""}>tout (${D.commits.length})</option>
        ${scopes.map(([s, k]) =>
          `<option value="${esc(s)}"${s === scope ? " selected" : ""}>${esc(s)} (${k})</option>`).join("")}
      </select>
    </div>
    ${!list.length ? vide(`<p>Aucun commit pour le scope <b>${esc(scope)}</b>.</p>`) :
      Object.keys(jours).sort().reverse().map(d => `
        <div class="jour">${jour(d)}</div>
        <div class="cmts">${jours[d].map(c => `<div class="cmt">
          <span class="h">${c.hash}</span>
          <span class="s">${ligne(c.sujet)}</span></div>`).join("")}</div>`).join("")}`;
}

/* L'échelle du temps, partagée par la frise et par les barres des cartes. Extraite ici
   parce que deux calculs finiraient par diverger : une barre de carte et une barre de
   frise qui ne diraient pas la même durée seraient pires qu'une seule des deux.

   L'axe part du premier COMMIT, pas du premier document. Mesuré : les dates d'entrée
   d'audits précédaient le travail de 33 jours, un quart de la largeur ne portant aucune
   barre. Le vide qui RESTE à l'intérieur n'est pas comprimé : il n'y en a qu'un, il ne
   rapprocherait qu'un seul chantier, et une échelle brisée détruirait la seule chose que
   ces barres servent à faire — comparer des durées. */
const JOUR = 864e5;
const tps = d => Date.parse(d + "T00:00:00");

function echelle(){
  const toutes = [], travaux = [];
  for (const c of D.chantiers) {
    for (const d of [c.premier?.date, c.dernier?.date, c.auditDate, c.ficheDate]) if (d) toutes.push(d);
    if (c.premier) travaux.push(c.premier.date);
  }
  for (const p of D.passes) for (const d of [p.entree, p.derniere]) if (d) toutes.push(d);
  if (!toutes.length) return null;
  const a = travaux.length ? Math.min(...travaux.map(tps)) : Math.min(...toutes.map(tps));
  const b = Math.max(...toutes.map(tps), tps(D.dernierJour || new Date().toISOString().slice(0, 10)));
  /* Une marge d'un jour de chaque côté : sans elle, le premier commit colle au bord et se
     lit comme une troncature plutôt que comme un début. */
  const lo = a - JOUR, amp = (b + JOUR) - lo;
  return { lo, amp, b,
    avant: d => tps(d) < lo,
    pc: d => Math.max(0, (tps(d) - lo) / amp * 100).toFixed(2) };
}

/* La même barre que sur la frise, posée sur une carte. Sans axe ni étiquette : ce qui se
   lit d'une carte à l'autre est la LONGUEUR et la POSITION, pas une date — la date exacte
   est déjà deux lignes plus haut. Un chantier sans commit n'a pas de piste du tout,
   plutôt qu'une piste vide qui se lirait comme une durée nulle. */
function barreCarte(c, e){
  if (!e || !c.premier) return "";
  const d1 = e.pc(c.premier.date), d2 = e.pc(c.dernier.date);
  return `<span class="mini" title="${esc(c.premier.date)} → ${esc(c.dernier.date)}"><span
    style="left:${d1}%;width:max(3px,${(d2 - d1).toFixed(2)}%)"></span></span>`;
}

/* ---------------- frise ---------------- */
/* Ce que la carte d'un chantier ne peut pas dire : sa FORME dans le temps. Mesuré sur
   quinze fiches, deux chantiers affichaient une carte identique — même statut, silence
   comparable — alors que l'un était un sprint de trois jours abandonné deux mois plus
   tôt et l'autre une tresse de deux mois avançant d'un commit par semaine. Le dernier
   commit seul ne distingue pas les deux ; les deux bornes, si.
   Pas de liens entre chantiers : la relation qui existe entre eux est la collision de
   fichiers, elle se dérive et ne se dessine pas en graphe. */
function vueFrise(){
  const e = echelle();
  if (!e) return vide(
    `<p>Rien à situer dans le temps : aucun commit ne cite un code de chantier, et
     aucune fiche n'est encore entrée dans le dépôt.</p>`);
  const { lo, b, avant, pc } = e;
  const t = tps;

  /* Traits de mois. Le premier de chaque mois compris dans l'intervalle : les mois n'ont
     pas la même longueur, un dégradé répété ne tomberait pas juste. */
  const mois = [];
  const d0 = new Date(lo); d0.setUTCDate(1);
  for (let x = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), 1));
       x.getTime() <= b + JOUR;
       x = new Date(Date.UTC(x.getUTCFullYear(), x.getUTCMonth() + 1, 1))) {
    const s = x.toISOString().slice(0, 10);
    const nom = x.toLocaleDateString("fr-FR", { month: "short", timeZone: "UTC" });
    /* Le mois du début n'a pas son 1er dans l'intervalle : sans ce cas, la région la plus
       à gauche reste sans étiquette et on ne sait pas où l'axe commence. Il est posé au
       bord, sans trait de séparation. */
    if (t(s) >= lo) mois.push({ s, nom, trait: true });
    else if (!mois.length && t(s) + 32 * JOUR > lo) mois.push({ s: new Date(lo).toISOString().slice(0, 10), nom, trait: false });
  }

  const ordre = D.chantiers.slice().sort((x, y) =>
    String(x.premier?.date || x.ficheDate || "9999").localeCompare(String(y.premier?.date || y.ficheDate || "9999")));

  const marque = (d, cls, quoi) => !d ? "" :
    `<span class="${cls}${avant(d) ? " fr-avant" : ""}" style="left:${pc(d)}%"
       title="${esc(quoi)} ${esc(d)}${avant(d) ? " — hors champ, avant le premier commit" : ""}"></span>`;

  /* Les deux bornes sont remises dans l'ordre avant de tracer. Une passe peut porter une
     `derniere` ANTÉRIEURE à l'entrée de son fichier — elle existait avant d'être migrée
     dans le dossier — et la soustraction sortait alors une largeur négative, donc une
     barre de 3 px posée du mauvais côté de sa propre date. Mesuré sur une passe de juillet
     migrée en août. */
  const barre = (dA, dB, cls, titre) => {
    if (!dA && !dB) return "";
    const [d1, d2] = [dA || dB, dB || dA].sort();
    return `<span class="${cls}" style="left:${pc(d1)}%;width:max(3px,${(pc(d2) - pc(d1)).toFixed(2)}%)"
       title="${esc(titre)}"></span>`;
  };

  const ligne = c => {
    const p1 = c.premier?.date, p2 = c.dernier?.date;
    const t = `<div class="fr-t">${
      p1 ? barre(p1, p2, "fr-b", `${p1} → ${p2} · ${c.commits} commit${c.commits > 1 ? "s" : ""}`) : ""
      }${marque(c.ficheDate, "fr-f", "fiche écrite le")}${marque(c.auditDate, "fr-a", "audit entré le")}</div>`;
    return `<div class="fr-l s-${slug(c.statut)}">
      <a class="fr-c" href="#/c/${encodeURIComponent(c.code)}">${esc(c.code)}</a>${t}</div>`;
  };

  /* Une passe se range SOUS son chantier : c'est déjà la relation que porte son propre
     `chantier:`, et la poser en glyphe de plus sur la ligne du chantier les empilait —
     trois passes de R3, dont deux à la même date. Sa barre va de son entrée à sa
     dernière rejoue : une passe écrite il y a deux mois et rejouée hier ne raconte pas
     la même chose qu'une passe écrite et jouée le même jour. */
  const ligneP = p => `<div class="fr-l fr-lp">
    <a class="fr-c" href="#/qa/${encodeURIComponent(p.file)}">${esc(p.nom)}</a>
    <div class="fr-t">${barre(p.entree, p.derniere, "fr-q",
      `${p.entree || "?"} → ${p.derniere || "jamais rejouée"} · ${p.faits}/${p.total}`)}</div></div>`;

  return `<div class="frise">
    <div class="fr-corps">
      <div class="fr-fond">${mois.filter(m => m.trait).map(m => `<span class="fr-mois" style="left:${pc(m.s)}%"></span>`).join("")}</div>
      ${ordre.map(c => ligne(c) + D.passes.filter(p => p.chantier === c.code).map(ligneP).join("")).join("")}
      ${D.passes.filter(p => !p.chantier).map(ligneP).join("")}
    </div>
    <div class="fr-axe"><span></span><div>${
      mois.map(m => `<span class="fr-m${m.trait ? "" : " fr-m0"}" style="left:${pc(m.s)}%">${esc(m.nom)}</span>`).join("")}</div></div>
    <p class="fr-leg"><b>barre pleine</b> premier &rarr; dernier commit de travail, la
      tenue du dossier exclue &middot; <b>point bleu</b> une passe de QA, de son entrée
      à sa dernière rejoue &mdash; souvent un point plutôt qu'une barre, la
      passe étant écrite et jouée dans la même semaine &middot;
      <b>losange</b> la fiche entre dans le dépôt &middot; <b>trait fin</b>
      l'audit entre dans le dépôt &middot; un repère <b>ouvert au bord
      gauche</b> est antérieur au premier commit, donc hors champ</p>
  </div>`;
}

/* ---------------- masses ---------------- */
/* Une courbe par aire, normalisée sur elle-même : les masses vont de 1 170 à 28 655
   lignes, une échelle commune écraserait tout sauf les deux plus grosses. */
function courbe(v, w = 132, h = 26){
  if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), amp = hi - lo || 1;
  const pts = v.map((n, i) =>
    `${(i * w / (v.length - 1)).toFixed(1)},${(h - 1 - (n - lo) / amp * (h - 2)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}"/></svg>`;
}

function vueMasses(){
  const m = D.masses;
  if (!m || !m.aires.length) return vide(
    `<p>Aucune masse mesurable — <code>git log --numstat</code> n'a rien rendu.</p>`);

  const sgn = n => (n > 0 ? "+" : "") + n.toLocaleString("fr-FR");
  return `<h2 class="sec"><span>Masses de code</span>
      <span class="n">${m.mois[0]} → ${m.mois[m.mois.length - 1]}</span></h2>
    <table class="masses">
      <thead><tr><th>aire</th><th></th><th>lignes</th><th>${m.fenetre} mois</th></tr></thead>
      <tbody>${m.aires.map(a => `<tr>
        <td class="a">${esc(a.nom)}</td>
        <td class="c">${courbe(a.valeurs)}</td>
        <td class="v">${a.total.toLocaleString("fr-FR")}</td>
        <td class="v ${a.delta < 0 ? "moins" : ""}">${sgn(a.delta)}</td>
      </tr>`).join("")}</tbody>
    </table>
    ${!m.jalons.length ? "" : `
      <h2 class="sec"><span>Jalons</span><span class="n">retraits de plus de 1 000 lignes</span></h2>
      <div class="cmts">${m.jalons.map(j => `<div class="cmt jal">
        <span class="h">${j.delta.toLocaleString("fr-FR")}</span>
        <span class="s">${ligne(j.sujet)}<i>${j.hash} · ${j.date}</i></span></div>`).join("")}</div>`}`;
}

/* ---------------- routage ---------------- */
function rendre(){
  const h = decodeURIComponent(location.hash.slice(2) || "");
  const vue = document.getElementById("vue");
  let html, onglet = "#/";
  if (h.startsWith("c/"))       html = vueFiche(h.slice(2));
  else if (h === "qa")          { html = vueQA();               onglet = "#/qa"; }
  else if (h.startsWith("qa/")) { html = vuePasse(h.slice(3));  onglet = "#/qa"; }
  else if (h === "fil")         { html = vueFil();              onglet = "#/fil"; }
  else if (h === "frise")       { html = vueFrise();           onglet = "#/frise"; }
  else if (h === "masses")      { html = vueMasses();           onglet = "#/masses"; }
  else                          html = vueChantiers();

  vue.innerHTML = bandePerime() + html;
  document.querySelectorAll("#tabs a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("href") === onglet));

  vue.querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", cocher));
  const sc = document.getElementById("sc");
  if (sc) sc.addEventListener("change", () => { scope = sc.value; rendre(); });
  const rz = document.getElementById("reset");
  if (rz) rz.addEventListener("click", () => armer(rz, h.slice(3)));
}

/* ---------------- écritures ---------------- */
async function poster(url, corps){
  const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" },
                               body: JSON.stringify(corps) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
}

async function cocher(ev){
  const cb = ev.target, { file, ligne } = cb.dataset, avant = !cb.checked;
  try {
    await poster("/cocher", { file, ligne: Number(ligne), fait: cb.checked });
    await charger();
    toast("écrit dans " + file);
  } catch (e) {
    cb.checked = avant;                       // remise dans l'état précédent
    toast(e.message, true);
  }
}

/* confirmation en deux temps — pas de dialogue natif */
let tArm;
function armer(bt, file){
  if (bt.dataset.armed === "1"){ clearTimeout(tArm); return reinit(file); }
  const p = byFile(file); if (!p) return;
  bt.dataset.armed = "1"; bt.classList.add("danger");
  bt.textContent = `décocher les ${p.total} cases — confirmer`;
  tArm = setTimeout(() => {
    bt.dataset.armed = "0"; bt.classList.remove("danger"); bt.textContent = "réinitialiser";
  }, 4000);
}

async function reinit(file){
  try {
    await poster("/reinitialiser", { file });
    await charger();
    toast("passe réinitialisée — l'état précédent reste dans git");
  } catch (e) { toast(e.message, true); }
}

let tT;
function toast(m, ko){
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.toggle("ko", !!ko); t.classList.add("on");
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ---------------- chargement ---------------- */
async function charger(){
  const r = await fetch("journal.json", { cache:"no-store" });
  D = await r.json(); RXL = null;
  document.getElementById("repo").textContent = D.repo;
  document.getElementById("br").textContent = D.branche;
  document.getElementById("sil").textContent = D.dernierJour
    ? `dernier commit le ${jour(D.dernierJour)} — il y a ${D.silenceCourant} jours`
    : "aucun commit";
  rendre();
}

addEventListener("hashchange", rendre);
charger().catch(() => {
