name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # ── Lint (ruff) — audit Q-01 ───────────────────────────────────────────────
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.14,<0.15"

      - name: Ruff check
        run: ruff check src tests

  # ── Python tests + contract freeze check ───────────────────────────────────
  test:
    name: Python tests & contract freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: pytest -q --cov=src/multicorpus_engine --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Regenerate OpenAPI spec
        run: python scripts/export_openapi.py

      - name: Check contract freeze (committed openapi.json must match generated)
        run: |
          python - <<'EOF'
          import json, sys, pathlib
          from multicorpus_engine.sidecar_contract import openapi_spec

          generated = json.dumps(openapi_spec(), indent=2, sort_keys=True, ensure_ascii=False)
          committed = pathlib.Path("docs/openapi.json").read_text(encoding="utf-8")
          if generated.strip() != committed.strip():
              print("ERROR: docs/openapi.json is out of date.")
              print("Run: python scripts/export_openapi.py  and commit the result.")
              sys.exit(1)
          print("OK: docs/openapi.json matches generated spec.")
          EOF

      - name: Check snapshot consistency
        run: |
          python - <<'EOF'
          import json, sys, pathlib
          from multicorpus_engine.sidecar_contract import openapi_spec

          spec = openapi_spec()
          generated_paths = sorted(
              f"{method.upper()} {path}"
              for path, methods in spec["paths"].items()
              for method in methods
          )
          snapshot_file = pathlib.Path("tests/snapshots/openapi_paths.json")
          snapshot = json.loads(snapshot_file.read_text(encoding="utf-8"))

          removed = [p for p in snapshot if p not in generated_paths]
          if removed:
              print(f"ERROR: {len(removed)} endpoint(s) removed from API (contract freeze violation):")
              for p in removed:
                  print(f"  - {p}")
              sys.exit(1)

          new_paths = [p for p in generated_paths if p not in snapshot]
          if new_paths:
              print(f"WARNING: {len(new_paths)} new endpoint(s) not yet in snapshot:")
              for p in new_paths:
                  print(f"  + {p}")
              print("Run: python scripts/export_openapi.py  and commit the updated snapshot.")
              sys.exit(1)

          print(f"OK: snapshot consistent ({len(snapshot)} paths).")
          EOF

  # ── TypeScript builds ───────────────────────────────────────────────────────
  build-ts:
    name: TypeScript builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: Install tauri-prep deps
        run: npm --prefix tauri-prep ci

      # S-03 (XSS gate): eslint-plugin-no-unsanitized blocks any NEW innerHTML/
      # outerHTML assignment that doesn't go through the safeHtml`` sink. The 89
      # pre-existing sites in the 4 giant screens are grandfathered in
      # tauri-prep/eslint-suppressions.json (native bulk suppressions) and burn
      # down via `npm run lint:prune`; new code cannot regress.
      - name: Lint tauri-prep (XSS gate — no-unsanitized, S-03)
        run: npm --prefix tauri-prep run lint

      - name: Build tauri-prep
        run: npm --prefix tauri-prep run build

      # T-03: the 394 tauri-prep vitest tests existed but were never run in CI —
      # only `build` was. Gate them now (deps already installed above).
      - name: Run tauri-prep unit tests (vitest)
        run: npm --prefix tauri-prep test

      - name: Install tauri-app deps
        run: npm --prefix tauri-app ci

      # S-03 phase 2 (XSS gate): same no-unsanitized guard as tauri-prep, now on
      # the concordancier (KWIC / document text / user query highlight). Every
      # dynamic innerHTML goes through the safeHtml`` sink (lib/safeHtml.ts) — no
      # baseline, the gate is fully strict from the start; new code cannot regress.
      - name: Lint tauri-app (XSS gate — no-unsanitized, S-03)
        run: npm --prefix tauri-app run lint

      - name: Build tauri-app
        run: npm --prefix tauri-app run build

      # T-03: replaces the ad-hoc node test (which tested a *copy* of buildFtsQuery)
      # with vitest importing the real features/search.ts (+ happy-dom).
      - name: Run tauri-app unit tests (vitest)
        run: npm --prefix tauri-app test

  # ── Shell app TypeScript build ──────────────────────────────────────────────
  build-shell:
    name: TypeScript shell build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: Install tauri-prep deps (required by shell imports)
        run: npm --prefix tauri-prep ci

      - name: Install tauri-app deps (required by shell imports)
        run: npm --prefix tauri-app ci

      - name: Install tauri-shell deps
        run: npm --prefix tauri-shell ci

      # S-03 phase 2 (XSS gate): no-unsanitized guard on the shell's OWN src only
      # (shell.ts, modules/*). The prep/app source it imports at source level is
      # already guarded in those packages, so the `src/**/*.ts` glob excludes
      # them. Dynamic innerHTML goes through the safeHtml`` sink reused from prep.
      - name: Lint tauri-shell (XSS gate — no-unsanitized, S-03)
        run: npm --prefix tauri-shell run lint

      - name: Build tauri-shell
        run: npm --prefix tauri-shell run build

      # T-03 / T-05: render-smoke for styleRegistry (real source, happy-dom).
      - name: Run tauri-shell unit tests (vitest)
        run: npm --prefix tauri-shell test

  # ── Rust du shell : les DEUX branches #[cfg] ──────────────────────────────
  # Ajouté le 2026-08-24. Jusqu'ici AUCUN workflow ne compilait ce Rust : le seul
  # qui le fait, tauri-shell-build.yml, ne se déclenche que sur un tag `v*` ou en
  # manuel. Un `main.rs` cassé serait donc parti jusqu'au tag de release avant que
  # quiconque s'en aperçoive. Et le problème n'est pas seulement « ça compile » :
  # `_kill_pid` a une branche par plateforme, et du code sous un `#[cfg]` inactif
  # est PARSÉ mais pas TYPÉ. Vérifier depuis un seul poste ne valide donc que la
  # moitié du fichier — celle de la machine qui tape. D'où une matrice.
  #
  # ubuntu + windows suffisent : la branche POSIX est le même source sous Linux et
  # sous macOS, et un runner macOS coûte dix fois un runner Linux pour zéro
  # couverture supplémentaire ici.
  check-rust:
    name: Shell Rust — cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # une plateforme rouge ne doit pas masquer l'autre
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: "tauri-shell/src-tauri -> target"

      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libgtk-3-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Install tauri-prep deps (required by shell imports)
        run: npm --prefix tauri-prep ci

      - name: Install tauri-app deps (required by shell imports)
        run: npm --prefix tauri-app ci

      - name: Install tauri-shell deps
        run: npm --prefix tauri-shell ci

      # `generate_context!` lit tauri.conf.json et EXIGE que `frontendDist` existe.
      # Sans `dist/`, la macro PANIQUE — donc avant la phase de typage. Le job
      # échouerait sans avoir rien vérifié, et pire, il redeviendrait vert le jour
      # où `dist/` traînerait pour une autre raison, en n'ayant toujours rien typé.
      # Mesuré sur macOS le 2026-08-24, c'est ce qui a failli rendre un faux vert.
      - name: Build the shell front (produces dist/, required by generate_context!)
        run: npm --prefix tauri-shell run build

      # `tauri-build` COPIE l'externalBin vers target/debug avant de compiler
      # (copy_binaries, tauri-build 2.5.5) et ne valide RIEN de son contenu : un
      # fichier vide suffit. Construire le vrai sidecar (PyInstaller, ~400 Mo)
      # coûterait plus que tout le reste du workflow, pour type-vérifier du Rust.
      - name: Placeholder sidecar (externalBin, contenu jamais lu)
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p tauri-shell/src-tauri/binaries
          : > "tauri-shell/src-tauri/binaries/multicorpus-${triple}${ext}"
          echo "placeholder: multicorpus-${triple}${ext}"

      # `--no-default-features` : le même profil que `tauri dev`, donc le même code
      # que celui qu'on exerce à la main.
      - name: cargo check
        run: cargo check --manifest-path tauri-shell/src-tauri/Cargo.toml --no-default-features

  # ── Sidecar binary build sanity check ─────────────────────────────────────
  build-sidecar-check:
    name: Sidecar binary build (Linux sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install project + packaging extras
        run: pip install -e ".[packaging]"

      - name: Build sidecar binary
        run: python scripts/build_sidecar.py --out /tmp/sidecar-ci-check

      - name: Verify manifest JSON and locate executable
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          manifest_path = pathlib.Path("/tmp/sidecar-ci-check/sidecar-manifest.json")
          if not manifest_path.exists():
              print("ERROR: sidecar-manifest.json not found")
              sys.exit(1)
          data = json.loads(manifest_path.read_text())
          required = ["name", "target_triple", "version", "format", "sha256", "executable_path"]
          missing = [k for k in required if k not in data]
          if missing:
              print(f"ERROR: manifest missing keys: {missing}")
              sys.exit(1)
          exe = pathlib.Path(data["executable_path"])
          if not exe.exists():
              print(f"ERROR: executable_path does not exist: {exe}")
              sys.exit(1)
          print(f"OK: manifest valid — {data['name']} v{data['version']} ({data['format']}, {data['target_triple']})")
          print(f"OK: executable_path exists: {exe}")
          # Write the path to a file for the next step
          pathlib.Path("/tmp/sidecar-exe-path").write_text(str(exe))
          EOF

      - name: Verify binary responds to --help (onefile and onedir safe)
        run: |
          # Read the executable path resolved from the manifest (onefile or onedir inner exe)
          EXE_PATH=$(cat /tmp/sidecar-exe-path)
          echo "Executable: $EXE_PATH"
          if [ -f "$EXE_PATH" ]; then
            "$EXE_PATH" --help
          elif [ -d "$EXE_PATH" ]; then
            # onedir: find the inner executable
            INNER="$EXE_PATH/$(basename "$EXE_PATH")"
            [ -f "$INNER" ] || INNER="$EXE_PATH/multicorpus"
            echo "onedir inner exe: $INNER"
            "$INNER" --help
          else
            echo "ERROR: executable does not exist at $EXE_PATH"
            exit 1
          fi

      - name: Smoke-run sidecar binary (serve + /health + service endpoints)
        run: python scripts/smoke_sidecar.py /tmp/sidecar-ci-check/sidecar-manifest.json
