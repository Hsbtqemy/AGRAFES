name: Journal de bord (Pages)

# Publie le journal de bord en lecture seule, pour le lire ailleurs que sur la machine
# qui le sert — `localhost:4123` n'existe pas sur un téléphone.
#
# Ce qui est publié est un export : bandeau daté, cases désactivées (elles ne peuvent
# rien écrire sans serveur), et les liens de fichier pointent vers ce dépôt à la
# révision courante plutôt que vers un `vscode://` inerte ailleurs. Le dossier
# `pilotage/` est déjà public dans ce dépôt : publier la vue n'expose rien de neuf,
# c'est le même contenu, lisible.
#
# AUCUN filtre de chemin, volontairement : le journal est dérivé de l'HISTORIQUE git
# autant que du dossier `pilotage/`. Un commit qui ne touche que `src/` change les
# masses, le silence des chantiers, la veille et les collisions. Filtrer sur
# `pilotage/**` publierait une vue périmée dès le premier commit de code.

on:
  push:
    branches: [dev, refonte]
  workflow_dispatch:

# Le journal montre la branche dans son en-tête, donc publier depuis `dev` ou `refonte`
# n'est pas ambigu pour qui lit. Mais un seul site existe : le dernier push gagne, et
# `cancel-in-progress` évite d'empiler des déploiements sur un dépôt qui reçoit
# vingt à quarante commits par jour.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # L'outil lit la fenêtre glissante des commits, les dates d'entrée des
          # documents et le front d'intégration : il lui faut tout l'historique.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      # `npm ci` à la racine n'installe que `pilote`, qui n'a aucune dépendance.
      - name: Installer l'outil
        run: npm ci --no-audit --no-fund

      # Les refs d'intégration de l'inventaire sont `origin/main` et `dev` ; le checkout
      # d'Actions ne crée pas de branche locale `dev`. MESURÉ sur une répétition à blanc :
      # sans cette étape l'export sort 18 fronts dont **0 intégré**, avec elle 18 fronts
      # dont **15 intégrés**. Le journal publié aurait donc annoncé que rien n'est intégré,
      # ce qui est faux et se lit comme une mesure.
      - name: Rendre les refs d'intégration atteignables
        run: |
          set -eu
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git show-ref --verify --quiet refs/heads/dev || git branch dev origin/dev || true

      # L'adresse des liens de fichier est passée explicitement plutôt que devinée du
      # remote : ici GitHub la connaît. Répété à blanc dans un clone local, l'export
      # annonçait « pas de remote » et sortait avec des liens inertes — deviner vaut là
      # où l'on n'a rien de mieux, pas là où l'on a la réponse.
      - name: Écrire l'export
        run: |
          node node_modules/pilote/journal.mjs exporter site \
            --web "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/"

      # Pages doit être activé sur le dépôt, source « GitHub Actions ». Fait une fois le
      # 2026-08-31 par l'API du compte. `enablement: true` a été essayé d'abord et échoue :
      # le jeton d'Actions n'a pas le droit de CRÉER un site Pages — « Resource not
      # accessible by integration ». Le laisser aurait donné un workflow rouge à chaque
      # passage si Pages venait à être désactivé, au lieu d'une erreur qui dit quoi faire.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

      - name: Dire où c'est
        run: |
          echo "Journal publié : ${{ steps.deploiement.outputs.page_url }}"
          echo "Lecture seule. Les cases se cochent depuis le dépôt."
