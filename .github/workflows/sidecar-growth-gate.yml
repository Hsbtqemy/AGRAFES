name: Sidecar growth gate

# Mécanisme : empêche `sidecar.py` de continuer à grossir indéfiniment
# par PRs incrémentales sous le radar.
#
# Mesure : croissance NETTE (insertions - deletions) sur fenêtre glissante
# 90 jours, mesurée via git log --numstat. Seuil : 2500 lignes depuis le
# 2026-08-25 (500 auparavant) — relevé DÉLIBÉRÉMENT et temporairement, voir
# « Pourquoi 2500 » plus bas.
#
# Override d'urgence : commit trailer `Sidecar-Growth-Override: <motif>` dans
# le dernier commit (typiquement un CVE ou un fix sécurité critique).
# Tracé en clair dans l'historique git, auditable, sans secret CI.
#
# Exemple de commit autorisé à dépasser :
#
#     fix(security): patch CVE-2026-XXXX dans curate handler
#
#     Sidecar-Growth-Override: CVE-2026-XXXX requires immediate fix,
#     refactor scheduled in v0.2.0
#
# Volontairement en `add - del` (croissance nette) plutôt que `add + del`
# (churn). On veut limiter la croissance, pas pénaliser les vrais refactors
# qui suppriment plus qu'ils n'ajoutent.

on:
  pull_request:
    paths:
      - 'src/multicorpus_engine/sidecar.py'

permissions:
  contents: read
  pull-requests: read

jobs:
  growth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0  # full history requis pour --since

      - name: Compute net growth on sliding 90-day window
        id: growth
        run: |
          set -eu
          # Pourquoi 2500, et pourquoi c'est provisoire (décidé le 2026-08-25).
          #
          # 500 était calibré sur le rythme du fichier APRÈS l'extraction A-01 :
          # net +373 sur la fenêtre avr→juil, +558 sur mai→août. Le seuil était juste.
          #
          # Mais ce net est financé par un one-off : l'extraction des 17-18 juin pèse
          # -1436 dans la fenêtre. Elle en sort le 15-16 septembre, et le gate lira
          # alors +1996 SANS UN SEUL COMMIT DE PLUS.
          #
          # Sur 90 jours, le fichier reçoit +2691 lignes et en rend -2134. Le net de
          # +558 ne tient donc que parce que l'extraction de juin est encore dans la
          # fenêtre ; sans elle, il ne reste presque plus rien pour compenser les
          # additions. 500 est inatteignable sans extraction continue, et un seuil
          # qu'on ne peut pas tenir n'alerte plus : il devient un warning permanent
          # qu'on apprend à ne plus lire.
          #
          # 2500 se tient juste au-dessus de ce rythme : il ne crie pas au loup le
          # 16 septembre, et il se déclenche si la cadence accélère.
          #
          # Ce n'est PAS un renoncement à A-01, qui reste ouvert et devra reprendre :
          # le vrai remède mesuré est de scinder le fichier par domaine (6516 lignes
          # de handlers de domaine contre 3924 de socle). Voir pilotage/A-01.md.
          THRESHOLD=2500
          # Date à laquelle ce relèvement doit être rejugé : 90 jours après la sortie
          # de fenêtre du 16 septembre, soit le premier moment où la mesure ne porte
          # plus aucune trace de l'extraction de juin ni de son expiration.
          THRESHOLD_REVIEW=2026-12-15
          DAYS=90
          FILE=src/multicorpus_engine/sidecar.py

          # `--format=` est INDISPENSABLE, et il manquait. Sans lui, `git log` intercale
          # les en-têtes et le CORPS DES MESSAGES de commit, et l'awk additionne de la
          # prose. Mesuré le 2026-08-25 : la ligne de message « Phase 1 inchangée). » a
          # trois champs, awk y lit $1="Phase" (→ 0) et $2="1" (→ 1), et retranche 1 du
          # total. Aujourd'hui l'erreur vaut 1 ligne ; le jour où un message dira « 500
          # lignes retirées de sidecar.py », le gate se trompera de 500.
          #
          # Le garde `$1 ~ /^[0-9]+$/` ferme la même porte par l'autre bout : seules les
          # vraies lignes de numstat comptent, quel que soit ce que git envoie en amont.
          # `NF==3` seul ne suffisait pas — une phrase de trois mots le satisfait.
          GROWTH=$(git log --numstat --format= --since="$DAYS days ago" -- "$FILE" \
            | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ {add+=$1; del+=$2} END {print (add-del)+0}')

          echo "growth=$GROWTH" >> "$GITHUB_OUTPUT"
          echo "threshold=$THRESHOLD" >> "$GITHUB_OUTPUT"
          echo "review=$THRESHOLD_REVIEW" >> "$GITHUB_OUTPUT"
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "Sidecar net growth over last $DAYS days: $GROWTH lines (threshold: $THRESHOLD)"

      - name: Check for override trailer
        id: override
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # Sur pull_request event, HEAD est un merge commit synthétique sans
          # message utilisateur. Il faut inspecter les vrais commits de la PR
          # via la plage base..head. On scanne TOUS les commits de la PR
          # plutôt que seulement le head — un dev peut placer le trailer sur
          # n'importe quel commit (souvent celui qui décrit le motif d'urgence).
          MSG=$(git log --format=%B "$BASE_SHA..$HEAD_SHA")
          if echo "$MSG" | grep -qE '^Sidecar-Growth-Override:[[:space:]]*\S+'; then
            REASON=$(echo "$MSG" | grep -E '^Sidecar-Growth-Override:' | head -1 | sed 's/^Sidecar-Growth-Override:[[:space:]]*//')
            echo "override=true" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            echo "::warning::Sidecar-Growth-Override invoked: $REASON"
          else
            echo "override=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate decision
        run: |
          set -eu
          GROWTH="${{ steps.growth.outputs.growth }}"
          THRESHOLD="${{ steps.growth.outputs.threshold }}"
          DAYS="${{ steps.growth.outputs.days }}"
          OVERRIDE="${{ steps.override.outputs.override }}"

          # « Pour l'instant » ne se tient que si quelque chose le rappelle : sans
          # cette date, un relèvement provisoire devient définitif par oubli.
          # `[[ ]]` et non `[ ]` : dans `[ ]`, le `>` est une REDIRECTION. Écrit ainsi,
          # le test créait un fichier nommé d'après la date de réexamen et se réduisait
          # à « chaîne non vide » — donc toujours vrai, donc un rappel à chaque exécution.
          # Dans `[[ ]]`, `>` est bien la comparaison lexicographique voulue.
          REVIEW="${{ steps.growth.outputs.review }}"
          if [[ "$(date -u +%Y-%m-%d)" > "$REVIEW" ]]; then
            echo "::warning::Le seuil de $THRESHOLD était provisoire et devait être rejugé le $REVIEW. A-01 (scission de sidecar.py par domaine) est-il repris ? Voir pilotage/A-01.md."
          fi

          if [ "$GROWTH" -le "$THRESHOLD" ]; then
            echo "✓ Sidecar growth ($GROWTH lines / $DAYS d) sous le seuil ($THRESHOLD). OK."
            exit 0
          fi

          if [ "$OVERRIDE" = "true" ]; then
            echo "⚠ Seuil dépassé ($GROWTH > $THRESHOLD) mais override autorisé."
            echo "   Motif : ${{ steps.override.outputs.reason }}"
            echo "   Le refactor reste obligatoire après ce fix d'urgence."
            exit 0
          fi

          # A-01 (audit 2026-06-12) : sidecar.py est en cours de réduction active
          # (handlers -> services/). Un hard-fail sur CHAQUE PR touchant sidecar.py
          # est devenu contre-productif — il passait au rouge les PRs de réduction
          # de dette elles-mêmes (la fenêtre 90 j reste dominée par une croissance
          # historique). On rend donc le gate INFORMATIF (warning, non bloquant)
          # tant que l'extraction A-01 progresse ; à re-durcir (exit 1) une fois le
          # net repassé sous le seuil. Voir docs/AUDIT_FOLLOW_UP.md (A-01).
          echo "::warning::sidecar.py : +$GROWTH lignes nettes sur $DAYS j (seuil $THRESHOLD). Extraction A-01 en cours — gate informatif (non bloquant)."
          exit 0
